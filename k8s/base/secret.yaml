# Valores de EXEMPLO/placeholder para uso local (Minikube). Nunca
# commitar senha real aqui — em um ambiente de verdade isso viria de
# um cofre de segredos (Sealed Secrets, Vault, External Secrets etc.),
# nunca de um Secret "puro" versionado no Git.
