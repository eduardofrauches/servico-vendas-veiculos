apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# A imagem "servico-vendas-veiculos:local" e construida localmente
# (docker build) e carregada no Minikube com "minikube image load" —
# nunca vem de um registry remoto nesta etapa.
images:
  - name: servico-vendas-veiculos
    newTag: local

patches:
  - target:
      kind: Deployment
      name: servico-vendas-veiculos
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
